<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D7BFF"/>
      <stop offset="1" stop-color="#7A4DFF"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9F0FF"/>
      <stop offset="1" stop-color="#C9D7FF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- monitor -->
  <rect x="84" y="132" width="270" height="182" rx="22" fill="#FFFFFF"/>
  <rect x="104" y="152" width="230" height="142" rx="10" fill="url(#screen)"/>
  <rect x="198" y="314" width="42" height="40" fill="#FFFFFF"/>
  <rect x="160" y="350" width="118" height="20" rx="10" fill="#FFFFFF"/>
  <!-- tablet, overlapping the monitor's edge -->
  <rect x="290" y="196" width="150" height="206" rx="24" fill="#FFFFFF" stroke="#5A63FF" stroke-width="14"/>
  <rect x="306" y="214" width="118" height="164" rx="10" fill="url(#screen)"/>
  <!-- "extend" chevron across the gap -->
  <path d="M338 270 l26 26 l-26 26" fill="none" stroke="#5A63FF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
