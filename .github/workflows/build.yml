name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-deb:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev libclang-dev clang pkg-config nasm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build .deb
        run: cargo deb
      - uses: actions/upload-artifact@v4
        with:
          name: extendo-deb
          path: host/target/debian/*.deb

  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: Build
        run: cargo build --release
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" windows\installer.iss
          Copy-Item target\release\extendo.exe target\installer\extendo-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: extendo-windows
          path: host/target/installer/*.exe

  android-apk:
    runs-on: ubuntu-24.04
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Decode signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SMON_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          SMON_VERSION_CODE: ${{ github.run_number }}
          SMON_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SMON_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SMON_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export SMON_VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          gradle --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/extendo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: extendo-apk
          path: android/app/build/outputs/apk/release/extendo.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-deb, windows-exe, android-apk]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
