[package]
name = "extendo"
version = "0.2.4"
edition = "2021"
description = "Extendo: use an Android tablet as a second monitor over USB or WiFi"
license = "MIT"
authors = ["Md Hafijur Rahman <mdhafijur.rahman@ogr.deu.edu.tr>"]
repository = "https://github.com/Hafij-BGE/Second-monitor"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
dirs = "7"
# glow (OpenGL) instead of the default wgpu: far smaller binary and less RAM.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "links", "wayland", "x11"] }
egui = "0.36"
if-addrs = "0.15"
log = "0.4"
openh264 = "0.9"
rayon = "1"
rfd = "0.17"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"
socket2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
winit = "0.30" # default features: client-side title bar on GNOME Wayland
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Md Hafijur Rahman <mdhafijur.rahman@ogr.deu.edu.tr>"
section = "video"
priority = "optional"
depends = "$auto"
recommends = "adb"
# Replaces the package from before the rename.
conflicts = "second-monitor"
replaces = "second-monitor"
extended-description = """\
Streams a virtual GNOME monitor (or a mirrored one) to the Extendo Android \
app over USB (adb) or WiFi, with touch and trackpad input, keyboard, \
clipboard sync and file transfer."""
assets = [
    ["target/release/extendo", "usr/bin/", "755"],
    ["packaging/extendo.desktop", "usr/share/applications/", "644"],
    ["../assets/extendo-256.png", "usr/share/icons/hicolor/256x256/apps/extendo.png", "644"],
    ["../assets/extendo-512.png", "usr/share/icons/hicolor/512x512/apps/extendo.png", "644"],
    ["../assets/extendo-icon.svg", "usr/share/icons/hicolor/scalable/apps/extendo.svg", "644"],
    # Mirror engine (scrcpy, Apache-2.0); run packaging/bundle-mirror.sh first.
    ["packaging/mirror/extendo-mirror", "usr/lib/extendo/", "755"],
    ["packaging/mirror/scrcpy-server", "usr/lib/extendo/", "644"],
    ["packaging/mirror/LICENSE-scrcpy", "usr/share/doc/extendo/", "644"],
    ["../LICENSE", "usr/share/doc/extendo/", "644"],
    ["../THIRD_PARTY_NOTICES.md", "usr/share/doc/extendo/", "644"],
]
